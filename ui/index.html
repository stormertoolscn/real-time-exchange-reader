<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汇率小宝</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 左侧导航 -->
  <aside id="sidebar">
    <div class="brand pywebview-drag-region">
      <div class="brand-icon">¥</div>
      <div class="brand-text">
        <span class="brand-name">实时汇率</span>
        <span class="brand-sub">中国银行 · 实时牌价</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-title">货币对</div>
      <div id="pairList" class="pair-list">
        <!-- 由 JS 渲染 -->
      </div>
    </div>

    <div class="nav-footer">
      <button class="ghost-btn" id="btnTheme">主题</button>
      <div class="theme-pop" id="themePop" hidden>
        <div class="theme-pop-item" data-theme="github">GitHub</div>
        <div class="theme-pop-item" data-theme="apple">苹果</div>
        <div class="theme-pop-item" data-theme="dsa">DSA</div>
        <div class="theme-pop-item" data-theme="chrome">Chrome</div>
        <div class="theme-pop-item" data-theme="Light">浅色</div>
        <div class="theme-pop-item" data-theme="Dark">深色</div>
        <div class="theme-pop-item" data-theme="System">系统默认</div>
      </div>
    </div>
  </aside>

  <!-- 左右栏分隔条：按住拖动调整宽度，双击还原 -->
  <div id="splitter" title="拖拽调整左右栏宽度（双击还原）"></div>

  <!-- 主内容 -->
  <main id="main">
    <header id="topbar" class="pywebview-drag-region">
      <div class="topbar-left">
        <div class="topbar-title" id="dragRegion">现汇买入价</div>
      </div>
      <div class="topbar-right">
        <span class="sync-time" id="syncTime">上次更新：--:--:--</span>
        <button class="round-btn" id="btnRefresh" title="刷新">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <div class="win-controls">
          <button class="win-btn" id="btnMin" title="最小化">
            <svg width="10" height="10" viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button class="win-btn" id="btnMax" title="最大化">
            <svg width="10" height="10" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button class="win-btn win-close" id="btnClose" title="关闭">
            <svg width="10" height="10" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.4"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <section id="hero">
      <div class="hero-card">
        <div class="hero-pair">
          <span class="pair-code" id="heroPairCode">USD/CNY</span>
          <span class="pair-name" id="heroPairName">美元 / 人民币</span>
        </div>
        <div class="hero-rate" id="heroRate">-.----</div>
        <div class="hero-tags">
          <span class="tag" id="tagSell">现汇卖出 --</span>
          <span class="tag" id="tagCash">现钞买入 --</span>
          <span class="tag" id="tagCashSell">现钞卖出 --</span>
        </div>
      </div>
    </section>

    <section id="actions">
      <button class="primary-btn" id="btnFetch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        抓取最新
      </button>
      <button class="secondary-btn" id="btnCopy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制汇率
      </button>
      <button class="secondary-btn" id="btnPaste">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        粘贴单元格
      </button>
    </section>

    <section id="log">
      <div class="log-title">
        <span>运行提示</span>
        <button class="icon-btn" id="btnClearLog" title="清空">✕</button>
      </div>
      <div id="logBody" class="log-body">
        <div class="log-empty">暂无日志</div>
      </div>
    </section>
  </main>
  <!-- 右下角缩放把手：拖动调整窗口大小 -->
  <div id="resizeGrip" title="拖动调整窗口大小"></div>
</div>

<script src="app.js"></script>
</body>
</html>
